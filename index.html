<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Traffic Planner Toolkit</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <h1>Traffic Planner Toolkit</h1>
    <p class="version">Version 0.5 Development</p>


    <!-- JOB DETAILS -->

    <section class="card">

      <h2>Job Details</h2>

      <label for="siteName">Site / Location</label>
      <input
        id="siteName"
        type="text"
        placeholder="Example: Edward Road"
      >

      <label for="projectName">Client / Project</label>
      <input
        id="projectName"
        type="text"
        placeholder="Example: Ventia"
      >

      <label for="roadName">Road Name</label>
      <input
        id="roadName"
        type="text"
        placeholder="Example: Rudd's Gully Road"
      >

    </section>


    <!-- ROAD SETUP -->

    <section class="card">

      <h2>Road Setup</h2>

      <label for="directionA">Direction 1</label>

      <select id="directionA">
        <option>Northbound</option>
        <option>Southbound</option>
        <option>Eastbound</option>
        <option>Westbound</option>
        <option>Inbound</option>
        <option>Outbound</option>
      </select>


      <label for="directionB">Direction 2</label>

      <select id="directionB">
        <option>Southbound</option>
        <option>Northbound</option>
        <option>Eastbound</option>
        <option>Westbound</option>
        <option>Inbound</option>
        <option>Outbound</option>
      </select>


      <label for="laneType">Lane / Movement Type</label>

      <select id="laneType">
        <option>Through Lane</option>
        <option>Turning Pocket</option>
        <option>Auxiliary Lane</option>
        <option>Slip Lane</option>
        <option>Merge Lane</option>
        <option>Other</option>
      </select>

    </section>


    <!-- COUNT TIMER -->

    <section class="card timer-card">

      <h2>Count Timer</h2>

      <div class="timer-display">

        <span id="timerDisplay">15:00</span>

        <small id="timerStatus">
          Ready
        </small>

      </div>


      <div class="timer-presets">

        <button
          type="button"
          onclick="setTimer(5)"
        >
          5 min
        </button>

        <button
          type="button"
          onclick="setTimer(10)"
        >
          10 min
        </button>

        <button
          type="button"
          onclick="setTimer(15)"
        >
          15 min
        </button>

        <button
          type="button"
          onclick="setTimer(30)"
        >
          30 min
        </button>

        <button
          type="button"
          onclick="setTimer(60)"
        >
          60 min
        </button>

      </div>


      <div class="custom-timer">

        <label for="customMinutes">
          Custom Minutes
        </label>

        <input
          id="customMinutes"
          type="number"
          min="1"
          inputmode="numeric"
          placeholder="Enter minutes"
        >

        <button
          type="button"
          onclick="setCustomTimer()"
        >
          Set Custom
        </button>

      </div>


      <button
        id="startTimerButton"
        class="start-count"
        type="button"
        onclick="startTimer()"
      >
        START COUNT
      </button>


      <button
        id="pauseTimerButton"
        class="pause-count"
        type="button"
        onclick="pauseTimer()"
        disabled
      >
        PAUSE
      </button>


      <button
        id="finishTimerButton"
        class="finish-count"
        type="button"
        onclick="finishTimer()"
        disabled
      >
        FINISH COUNT
      </button>

      <button
  id="resetTimerButton"
  class="reset-timer"
  type="button"
  onclick="resetTimer()"
>
  RESET TIMER
</button>
      
    </section>


    <!-- TRAFFIC COUNT -->

    <section class="card">

      <h2 id="roadTitle">
        Traffic Count
      </h2>


      <!-- DIRECTION A -->

      <h3 id="directionALabel">
        Direction 1
      </h3>

      <div class="button-grid">

        <button onclick="addCount('A', 'Light Vehicle')">
          Car / Light
          <span id="directionALight">0</span>
        </button>

        <button onclick="addCount('A', 'Heavy Vehicle')">
          Heavy
          <span id="directionAHeavy">0</span>
        </button>

        <button onclick="addCount('A', 'Bus')">
          Bus
          <span id="directionABus">0</span>
        </button>

        <button onclick="addCount('A', 'Pedestrian')">
          Pedestrian
          <span id="directionAPedestrian">0</span>
        </button>

      </div>

      <p class="direction-total">
        Direction Total:
        <span id="directionATotal">0</span>
      </p>


      <!-- DIRECTION B -->

      <h3 id="directionBLabel">
        Direction 2
      </h3>

      <div class="button-grid">

        <button onclick="addCount('B', 'Light Vehicle')">
          Car / Light
          <span id="directionBLight">0</span>
        </button>

        <button onclick="addCount('B', 'Heavy Vehicle')">
          Heavy
          <span id="directionBHeavy">0</span>
        </button>

        <button onclick="addCount('B', 'Bus')">
          Bus
          <span id="directionBBus">0</span>
        </button>

        <button onclick="addCount('B', 'Pedestrian')">
          Pedestrian
          <span id="directionBPedestrian">0</span>
        </button>

      </div>

      <p class="direction-total">
        Direction Total:
        <span id="directionBTotal">0</span>
      </p>

    </section>


    <!-- SUMMARY -->

    <section class="card summary">

      <h2>
        Total Count:
        <span id="totalCount">0</span>
      </h2>

      <button
        class="undo"
        onclick="undoLast()"
      >
        Undo Last Tap
      </button>

      <button
        class="export"
        onclick="exportCSV()"
      >
        Export Report
      </button>

      <h3>Last Entry</h3>

      <p id="lastEntry">
        None yet
      </p>

    </section>

  </div>


  <script src="script.js?v=timer2"></script>

</body>

</html>
